<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/avatar.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" />
    <!-- The avatar is the LCP candidate on Home/Me; fetch it immediately
         instead of waiting on JS to mount and request it. -->
    <link rel="preload" as="image" href="/avatar.jpg" />
    <script>
      // The app waits on these two responses before revealing itself (see
      // useAppReady/App.tsx). Firing them here means the network round-trip
      // overlaps with the JS bundle downloading/parsing/executing instead of
      // only starting once React has mounted and run its effects.
      window.__preload = {
        '/api/github/summary': fetch('/api/github/summary'),
        '/api/lastfm/dashboard': fetch('/api/lastfm/dashboard'),
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <title>Yukishiro's profile</title>
    <meta name="description" content="ゆきしろについて。各種SNSリンクや過去の創作物等を置いています。" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ibutya.com" />
    <meta property="og:title" content="Yukishiro's profile" />
    <meta property="og:description" content="ゆきしろについて。各種SNSリンクや過去の創作物等を置いています。" />
    <meta property="og:url" content="https://ibutya.com" />
    <meta property="og:image" content="https://ibutya.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yukishiro's profile" />
    <meta name="twitter:description" content="ゆきしろについて。各種SNSリンクや過去の創作物等を置いています。" />
    <meta name="twitter:image" content="https://ibutya.com/og-image.png" />
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #fafafa;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #app-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .app-loader-text {
        display: flex;
        align-items: center;
        gap: 1px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 700;
        color: #71717a;
      }
      .app-loader-dots span {
        opacity: 0;
        animation: app-loader-blink 1.4s infinite;
      }
      .app-loader-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .app-loader-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes app-loader-blink {
        0%,
        80%,
        100% {
          opacity: 0;
        }
        40% {
          opacity: 1;
        }
      }
      .app-loader-bar {
        width: 140px;
        height: 4px;
        border-radius: 999px;
        background: #e4e4e7;
        overflow: hidden;
      }
      .app-loader-bar-fill {
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #f9a8d4, #ec4899);
        animation: app-loader-slide 1.1s ease-in-out infinite;
      }
      @keyframes app-loader-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-loader">
      <p class="app-loader-text">
        Loading<span class="app-loader-dots"><span>.</span><span>.</span><span>.</span></span>
      </p>
      <div class="app-loader-bar"><div class="app-loader-bar-fill"></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
